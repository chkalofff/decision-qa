name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked project dependencies
        run: python -m pip install -r backend/requirements.txt -r cli/requirements.txt
      - name: Backend and CLI tests
        run: python scripts/ci_pytest.py
      - name: Real Windows manifest lock
        if: always() && runner.os == 'Windows'
        run: python scripts/ci_pytest.py cli/tests/test_run.py::test_skip_processed_reuse_cosmetics_models_and_lock
        env:
          PYTEST_CI_OUTPUT: pytest-lock-output.txt
          PYTEST_CI_JUNIT: .pytest-ci-lock-results.xml
      - name: Real dqa.cmd version against isolated backend
        if: always() && runner.os == 'Windows'
        run: python cli/tests/cmd_smoke.py
      - name: Upload backend/CLI failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-cli-${{ matrix.os }}
          path: |
            .pytest-ci-results.xml
            .pytest-ci-lock-results.xml
            pytest-output.txt
            pytest-lock-output.txt
            dqa-cmd-smoke.log
          if-no-files-found: ignore
          retention-days: 3

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend tests
        run: node frontend/tests/run.mjs
